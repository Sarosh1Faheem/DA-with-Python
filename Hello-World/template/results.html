<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short URL</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
        }

        .short-url {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .btn-custom {
            background: #00c6ff;
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background: #0072ff;
        }

        .btn-secondary {
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>✅ Your Short URL is Ready</h2>

        <div class="short-url">
            <a href="{{ short_url }}" target="_blank" class="text-info">
                {{ short_url }}
            </a>
        </div>

        <!-- Copy Button -->
        <button class="btn btn-custom w-100 mb-3" onclick="copyToClipboard()">
            📋 Copy Link
        </button>

        <!-- Back Button -->
        <a href="/" class="btn btn-secondary w-100">
            🔙 Shorten Another URL
        </a>
    </div>

    <!-- JavaScript -->
    <script>
        function copyToClipboard() {
            const text = "{{ short_url }}";
            navigator.clipboard.writeText(text);
            alert("Copied to clipboard! ✅");
        }
    </script>

</body>
</html>
