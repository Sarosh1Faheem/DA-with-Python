<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart URL Shortener</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styling -->
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-custom {
            background: #00c6ff;
            border: none;
            border-radius: 10px;
            padding: 12px;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background: #0072ff;
        }

        h1 {
            font-weight: 600;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="card text-center">
        <h1>🔗 Smart URL Shortener</h1>
        <p class="mb-4">Turn long links into short, clean, shareable URLs instantly.</p>

        <form method="post">
            <input 
                type="text" 
                name="url" 
                class="form-control mb-3" 
                placeholder="Paste your long URL here..." 
                required
            >

            <button type="submit" class="btn btn-custom w-100">
                🚀 Shorten URL
            </button>
        </form>
    </div>

</body>
</html>
